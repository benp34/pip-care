<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Family on Pip</title>
<meta name="description" content="You've been invited to help care for a dog on Pip. Use this family code to join.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="_styles.css">
<style>
.join-card{max-width:480px;margin:48px auto;padding:32px 24px;background:#FAF5FF;border-radius:20px;text-align:center}
.join-title{font-family:'Quicksand',-apple-system,sans-serif;font-weight:700;font-size:24px;color:#111827;margin:0 0 8px}
.join-sub{font-family:-apple-system,sans-serif;font-size:15px;color:#6B7280;margin:0 0 24px;line-height:1.5}
.code-box{display:inline-block;padding:16px 24px;background:white;border:2px dashed #A855F7;border-radius:14px;font-family:'SF Mono',Menlo,monospace;font-size:28px;font-weight:600;color:#7C3AED;letter-spacing:2px;margin-bottom:16px}
.copy-btn{display:block;width:100%;padding:14px 24px;background:#A855F7;color:white;border:none;border-radius:14px;font-family:-apple-system,sans-serif;font-weight:600;font-size:16px;cursor:pointer;margin-top:8px}
.copy-btn:active{background:#7C3AED}
.copy-btn.copied{background:#16A34A}
.steps{text-align:left;margin-top:28px;padding-top:24px;border-top:1px solid #E5E7EB;font-family:-apple-system,sans-serif;font-size:14px;color:#6B7280;line-height:1.7}
.steps strong{color:#111827}
.dl-link{display:inline-block;margin-top:20px;font-family:-apple-system,sans-serif;font-size:14px;color:#A855F7;text-decoration:none;font-weight:600}
.no-code{font-family:-apple-system,sans-serif;color:#9CA3AF;font-size:15px}
</style>
</head>
<body>
<div class="container">
  <header>
    <a class="logo" href="https://pip.dog"><span class="dot"></span> Pip</a>
  </header>

  <div class="join-card">
    <h1 class="join-title">You're invited to Pip</h1>
    <p class="join-sub">Use this family code to join and help care for the dog.</p>
    <div id="code" class="code-box">––––––––</div>
    <button id="copyBtn" class="copy-btn" type="button">Copy code</button>

    <div class="steps">
      <p><strong>1.</strong> Tap "Copy code" above.</p>
      <p><strong>2.</strong> Open the Pip app (or download it from the App Store).</p>
      <p><strong>3.</strong> On the welcome screen, tap "Join a family" and paste the code.</p>
    </div>

    <a class="dl-link" href="https://apps.apple.com/app/id6763566938">Download Pip on the App Store →</a>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var code = (params.get('code') || '').toUpperCase().trim();
  var codeEl = document.getElementById('code');
  var btn = document.getElementById('copyBtn');
  if (!code) {
    codeEl.textContent = '—';
    codeEl.className = 'no-code';
    btn.style.display = 'none';
    document.querySelector('.join-sub').textContent = 'No code in this link. Ask the sender to share again.';
    return;
  }
  codeEl.textContent = code;
  btn.addEventListener('click', function(){
    function done(){
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copy code'; btn.classList.remove('copied'); }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function(){
        // fallback
        var ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch(e){}
        document.body.removeChild(ta);
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = code; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){}
      document.body.removeChild(ta);
    }
  });
})();
</script>
</body>
</html>
